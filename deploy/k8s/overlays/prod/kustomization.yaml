apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: fitness-prod

resources:
  - ../../base
  - namespace.yaml

patches:
  - path: ingress-patch.yaml
    target:
      kind: Ingress
      name: fitness-api

images:
  - name: fitness/eureka
    newName: registry.example.com/fitness/eureka
    newTag: latest
  - name: fitness/userservice
    newName: registry.example.com/fitness/userservice
    newTag: latest
  - name: fitness/activityservice
    newName: registry.example.com/fitness/activityservice
    newTag: latest
  - name: fitness/aiservice
    newName: registry.example.com/fitness/aiservice
    newTag: latest
