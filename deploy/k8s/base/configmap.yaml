apiVersion: v1
kind: ConfigMap
metadata:
  name: fitness-common
  labels:
    app.kubernetes.io/part-of: fitness
data:
  CORS_ALLOWED_ORIGINS: "https://aura.gaourav.space"
  JWT_ISSUER: "https://userservice.fitness.local"
  JWT_AUDIENCE: "fitness-api"
  JWT_KEY_ID: "fitness-key-1"
  JWT_TTL: "PT15M"
  JWT_REFRESH_TTL: "P7D"
  EUREKA_SCHEME: "http"
  EUREKA_HOST: "eureka"
  EUREKA_SERVER_PORT: "8761"
  EUREKA_NON_SECURE_PORT_ENABLED: "true"
  EUREKA_PREFER_IP_ADDRESS: "true"
  TLS_ENABLED: "false"
  SERVER_FORWARD_HEADERS_STRATEGY: "framework"
  SPRINGDOC_ENABLED: "false"
  KAFKA_TOPIC: "activity-topic"
  KAFKA_SECURITY_PROTOCOL: "SASL_PLAINTEXT"
  KAFKA_SASL_MECHANISM: "PLAIN"
  KAFKA_CONSUMER_GROUP: "aiservice"
  KAFKA_TRUSTSTORE_LOCATION: "/opt/java/openjdk/lib/security/cacerts"
  KAFKA_TRUSTSTORE_PASSWORD: "changeit"
