# Do not apply this file with placeholder values.
# Create the real Secret in each namespace after replacing every placeholder.
#
# kubectl -n fitness-prod create secret generic fitness-secrets \
#   --from-literal=JWT_PRIVATE_KEY='...' \
#   --from-literal=JWT_PUBLIC_KEY='...' \
#   --from-literal=INTERNAL_API_KEYS='...' \
#   --from-literal=INTERNAL_API_KEY='...' \
#   --from-literal=DB_USERNAME='fitness' \
#   --from-literal=DB_PASSWORD='...' \
#   --from-literal=MONGO_ROOT_USERNAME='fitness' \
#   --from-literal=MONGO_ROOT_PASSWORD='...' \
#   --from-literal=EUREKA_USERNAME='eureka' \
#   --from-literal=EUREKA_PASSWORD='...' \
#   --from-literal=KAFKA_SASL_USERNAME='fitnessapp' \
#   --from-literal=KAFKA_SASL_PASSWORD='...' \
#   --from-literal=AI_API_KEY='...'
apiVersion: v1
kind: Secret
metadata:
  name: fitness-secrets
type: Opaque
stringData:
  JWT_PRIVATE_KEY: REPLACE_WITH_BASE64_PKCS8_PRIVATE_KEY
  JWT_PUBLIC_KEY: REPLACE_WITH_BASE64_X509_PUBLIC_KEY
  INTERNAL_API_KEYS: REPLACE_WITH_INTERNAL_API_KEYS
  INTERNAL_API_KEY: REPLACE_WITH_INTERNAL_API_KEY
  DB_USERNAME: fitness
  DB_PASSWORD: REPLACE_WITH_DATABASE_PASSWORD
  MONGO_ROOT_USERNAME: fitness
  MONGO_ROOT_PASSWORD: REPLACE_WITH_MONGODB_PASSWORD
  EUREKA_USERNAME: eureka
  EUREKA_PASSWORD: REPLACE_WITH_EUREKA_PASSWORD
  KAFKA_SASL_USERNAME: fitnessapp
  KAFKA_SASL_PASSWORD: REPLACE_WITH_KAFKA_PASSWORD
  AI_API_KEY: ""
