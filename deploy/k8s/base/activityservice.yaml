apiVersion: apps/v1
kind: Deployment
metadata:
  name: activityservice
  labels:
    app.kubernetes.io/name: activityservice
    app.kubernetes.io/part-of: fitness
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: activityservice
  template:
    metadata:
      labels:
        app.kubernetes.io/name: activityservice
        app.kubernetes.io/part-of: fitness
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: activityservice
          image: fitness/activityservice:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8082
          envFrom:
            - configMapRef:
                name: fitness-common
          env:
            - name: ACTIVITY_SERVICE_PORT
              value: "8082"
            - name: MONGO_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fitness-secrets
                  key: MONGO_ROOT_USERNAME
            - name: MONGO_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fitness-secrets
                  key: MONGO_ROOT_PASSWORD
            - name: MONGODB_URI
              value: "mongodb://$(MONGO_ROOT_USERNAME):$(MONGO_ROOT_PASSWORD)@mongodb:27017/activityfitness?authSource=admin"
            - name: MONGODB_DATABASE
              value: "activityfitness"
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: "kafka:9092"
            - name: KAFKA_SASL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fitness-secrets
                  key: KAFKA_SASL_USERNAME
            - name: KAFKA_SASL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fitness-secrets
                  key: KAFKA_SASL_PASSWORD
            - name: KAFKA_SASL_JAAS_CONFIG
              value: 'org.apache.kafka.common.security.plain.PlainLoginModule required username="$(KAFKA_SASL_USERNAME)" password="$(KAFKA_SASL_PASSWORD)";'
            - name: USER_SERVICE_URL
              value: "http://USERSERVICE"
            - name: USER_SERVICE_TIMEOUT
              value: "PT3S"
            - name: JWT_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: fitness-secrets
                  key: JWT_PUBLIC_KEY
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: fitness-secrets
                  key: INTERNAL_API_KEY
            - name: EUREKA_USERNAME
              valueFrom:
                secretKeyRef:
                  name: fitness-secrets
                  key: EUREKA_USERNAME
            - name: EUREKA_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: fitness-secrets
                  key: EUREKA_PASSWORD
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: EUREKA_INSTANCE_HOSTNAME
              value: "$(POD_IP)"
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: activityservice
  labels:
    app.kubernetes.io/name: activityservice
    app.kubernetes.io/part-of: fitness
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: activityservice
  ports:
    - name: http
      port: 8082
      targetPort: http
