apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: fitness
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - env: dev
            namespace: fitness-dev
          - env: prod
            namespace: fitness-prod
  template:
    metadata:
      name: fitness-{{env}}
      labels:
        app.kubernetes.io/part-of: fitness
    spec:
      project: fitness
      source:
        repoURL: https://github.com/GaouravPatil/Fitness-Microservice.git
        targetRevision: main
        path: deploy/k8s/overlays/{{env}}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{namespace}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=false
          - ApplyOutOfSyncOnly=true
          - PrunePropagationPolicy=foreground
        retry:
          limit: 5
          backoff:
            duration: 10s
            factor: 2
            maxDuration: 5m
