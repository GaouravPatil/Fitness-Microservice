spring:
  application:
    name: eureka
  security:
    user:
      name: ${EUREKA_USERNAME}
      password: ${EUREKA_PASSWORD}

server:
  port: ${EUREKA_SERVER_PORT:8761}
  address: ${EUREKA_BIND_ADDRESS:127.0.0.1}

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false

management:
  endpoints:
    web:
      exposure:
        include: health
