spring:
  application:
    name: activityservice

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/activityfitness}
      database: ${MONGODB_DATABASE:activityfitness}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

kafka:
  topic:
    name: ${KAFKA_TOPIC:activity-topic}
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}
  publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:PT5S}

eureka:
  client:
    service-url:
      defaultZone: "http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/"
  instance:
    prefer-ip-address: true

app:
  jwt:
    issuer: ${JWT_ISSUER:https://userservice.fitness.local}
    audience: ${JWT_AUDIENCE:fitness-api}
    public-key: ${JWT_PUBLIC_KEY}
  internal:
    api-key: ${INTERNAL_API_KEY}
  user-service:
    base-url: ${USER_SERVICE_URL:http://USERSERVICE}
    timeout: ${USER_SERVICE_TIMEOUT:PT3S}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

server:
  port: ${ACTIVITY_SERVICE_PORT:8082}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
