spring:
  application:
    name: activityservice

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/activityfitness}
      database: ${MONGODB_DATABASE:activityfitness}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:SASL_SSL}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:PLAIN}
      sasl.jaas.config: '${KAFKA_SASL_JAAS_CONFIG}'
      ssl.truststore.location: ${KAFKA_TRUSTSTORE_LOCATION:certs/truststore.p12}
      ssl.truststore.password: '${KAFKA_TRUSTSTORE_PASSWORD}'
      ssl.truststore.type: PKCS12
      ssl.endpoint.identification.algorithm: https
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false

kafka:
  topic:
    name: ${KAFKA_TOPIC:activity-topic}
    partitions: ${KAFKA_TOPIC_PARTITIONS:3}
    replicas: ${KAFKA_TOPIC_REPLICAS:1}
  publish-timeout: ${KAFKA_PUBLISH_TIMEOUT:PT5S}

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_SCHEME:http}://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/"
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    secure-port-enabled: ${TLS_ENABLED:false}
    non-secure-port-enabled: ${EUREKA_NON_SECURE_PORT_ENABLED:true}
    secure-port: ${server.port}
    home-page-url: "${EUREKA_SCHEME:http}://${EUREKA_INSTANCE_HOSTNAME:localhost}:${server.port}/"
    status-page-url: "${EUREKA_SCHEME:http}://${EUREKA_INSTANCE_HOSTNAME:localhost}:${server.port}/actuator/info"
    health-check-url: "${EUREKA_SCHEME:http}://${EUREKA_INSTANCE_HOSTNAME:localhost}:${server.port}/actuator/health"

app:
  jwt:
    issuer: ${JWT_ISSUER:https://userservice.fitness.local}
    audience: ${JWT_AUDIENCE:fitness-api}
    public-key: ${JWT_PUBLIC_KEY}
  internal:
    api-key: ${INTERNAL_API_KEY}
  user-service:
    base-url: ${USER_SERVICE_URL:https://USERSERVICE}
    timeout: ${USER_SERVICE_TIMEOUT:PT3S}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

resilience4j:
  circuitbreaker:
    instances:
      userService:
        sliding-window-size: 10
        minimum-number-of-calls: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true

server:
  port: ${ACTIVITY_SERVICE_PORT:8082}
  ssl:
    enabled: ${TLS_ENABLED:false}
    key-store: "file:${TLS_CERT_DIR:certs}/activityservice.p12"
    key-store-password: ${TLS_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: activityservice

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
