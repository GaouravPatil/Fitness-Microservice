spring:
  application:
    name: aiservice

  data:
    mongodb:
      uri: ${AI_MONGODB_URI:mongodb://localhost:27017/airecommendationfitness}
      database: ${AI_MONGODB_DATABASE:airecommendationfitness}
      auto-index-creation: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_CONSUMER_GROUP:aiservice}
      auto-offset-reset: earliest

kafka:
  topic:
    name: ${KAFKA_TOPIC:activity-topic}

eureka:
  client:
    service-url:
      defaultZone: "http://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/"
  instance:
    prefer-ip-address: true

app:
  jwt:
    issuer: ${JWT_ISSUER:https://userservice.fitness.local}
    audience: ${JWT_AUDIENCE:fitness-api}
    public-key: ${JWT_PUBLIC_KEY}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  ai:
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}

server:
  port: ${AI_SERVICE_PORT:8083}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
