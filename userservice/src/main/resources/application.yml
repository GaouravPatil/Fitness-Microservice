spring:
  application:
    name: userservice

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fitnessdb}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:validate}
    open-in-view: false
    show-sql: ${JPA_SHOW_SQL:false}
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    baseline-version: 1

eureka:
  client:
    service-url:
      defaultZone: "${EUREKA_SCHEME:http}://${EUREKA_USERNAME}:${EUREKA_PASSWORD}@${EUREKA_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/"
  instance:
    hostname: ${EUREKA_INSTANCE_HOSTNAME:localhost}
    prefer-ip-address: ${EUREKA_PREFER_IP_ADDRESS:false}
    secure-port-enabled: ${TLS_ENABLED:false}
    non-secure-port-enabled: ${EUREKA_NON_SECURE_PORT_ENABLED:true}
    secure-port: ${server.port}
    home-page-url: "${EUREKA_SCHEME:http}://${EUREKA_INSTANCE_HOSTNAME:localhost}:${server.port}/"
    status-page-url: "${EUREKA_SCHEME:http}://${EUREKA_INSTANCE_HOSTNAME:localhost}:${server.port}/actuator/info"
    health-check-url: "${EUREKA_SCHEME:http}://${EUREKA_INSTANCE_HOSTNAME:localhost}:${server.port}/actuator/health"

app:
  jwt:
    issuer: ${JWT_ISSUER:https://userservice.fitness.local}
    audience: ${JWT_AUDIENCE:fitness-api}
    key-id: ${JWT_KEY_ID:fitness-key-1}
    private-key: ${JWT_PRIVATE_KEY}
    public-key: ${JWT_PUBLIC_KEY}
    ttl: ${JWT_TTL:PT15M}
    refresh-ttl: ${JWT_REFRESH_TTL:P7D}
  internal:
    api-keys: "${INTERNAL_API_KEYS:${INTERNAL_API_KEY:}}"
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  security:
    rate-limit:
      login-limit: ${RATE_LIMIT_LOGIN:10}
      login-window: ${RATE_LIMIT_LOGIN_WINDOW:PT1M}
      register-limit: ${RATE_LIMIT_REGISTER:5}
      register-window: ${RATE_LIMIT_REGISTER_WINDOW:PT1H}
    login-attempts:
      max-attempts: ${LOGIN_MAX_ATTEMPTS:5}
      window: ${LOGIN_ATTEMPT_WINDOW:PT15M}

server:
  port: ${USERSERVICE_PORT:8081}
  ssl:
    enabled: ${TLS_ENABLED:false}
    key-store: "file:${TLS_CERT_DIR:certs}/userservice.p12"
    key-store-password: ${TLS_KEYSTORE_PASSWORD:changeit}
    key-store-type: PKCS12
    key-alias: userservice

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    enabled: ${SPRINGDOC_ENABLED:false}
  swagger-ui:
    enabled: ${SPRINGDOC_ENABLED:false}
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [%X{correlationId:-}]"
