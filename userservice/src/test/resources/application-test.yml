spring:
  datasource:
    url: jdbc:h2:mem:userservice;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  cloud:
    discovery:
      enabled: false

server:
  ssl:
    enabled: false

eureka:
  client:
    enabled: false

app:
  jwt:
    issuer: https://userservice.fitness.local
    audience: fitness-api
    key-id: test-key
    private-key: 
    public-key: 
    ttl: PT15M
    refresh-ttl: P7D
  internal:
    api-keys: test-internal-key
